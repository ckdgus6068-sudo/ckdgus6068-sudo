name: Jelly Calendar APK

on:
  push:
    paths:
      - "jelly-calendar/**"
      - ".github/workflows/jelly-calendar-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: jelly-calendar
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (scheduling rules)
        run: ./gradlew --no-daemon :core:test

      - name: Build APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/JellyCalendar-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: JellyCalendar-apk
          path: jelly-calendar/dist/*.apk
          if-no-files-found: error

  # Replaces one rolling release so that the phone can always download the newest APK
  # from the same link, without signing in:
  # https://github.com/<owner>/<repo>/releases/download/jelly-calendar-latest/JellyCalendar.apk
  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || startsWith(github.ref_name, 'claude/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: jelly-calendar-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: jelly-calendar-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: JellyCalendar-apk
          path: dist

      - name: Publish the rolling release
        run: |
          set -euo pipefail
          apk="$(ls dist/*.apk | head -n 1)"
          cp "$apk" dist/JellyCalendar.apk
          short="${GITHUB_SHA::7}"
          cat > notes.md <<EOF
          푸시할 때마다 자동으로 다시 만들어지는 최신 빌드입니다 (커밋 ${short}).

          - 설치: 휴대폰에서 아래 **JellyCalendar.apk**를 눌러 내려받은 뒤 실행합니다. “출처를 알 수 없는 앱 설치”를 허용해야 합니다.
          - 업데이트: 새 APK를 그대로 덮어 설치하면 데이터가 유지됩니다.
          EOF
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh api -X DELETE "repos/${GH_REPO}/git/refs/tags/${TAG}" >/dev/null 2>&1 || true
          sleep 3
          gh release create "$TAG" dist/JellyCalendar.apk \
            --target "$GITHUB_SHA" \
            --title "젤리 캘린더 최신 버전 (${short})" \
            --notes-file notes.md \
            --latest
