name: Jelly Calendar APK

on:
  push:
    paths:
      - "jelly-calendar/**"
      - "docs/**"
      - ".github/workflows/jelly-calendar-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: jelly-calendar
    outputs:
      # "true" only when the APK carries the private release key (checked below).
      signed: ${{ steps.certificate.outputs.signed }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (scheduling rules)
        run: ./gradlew --no-daemon :core:test

      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.JELLY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/jelly-release.jks"
            echo "JELLY_KEYSTORE_FILE=$RUNNER_TEMP/jelly-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::JELLY_KEYSTORE_BASE64 is not set: this APK gets a throwaway debug key and is not published."
          fi

      - name: Build APK
        run: ./gradlew --no-daemon :app:assembleRelease
        env:
          JELLY_KEYSTORE_PASSWORD: ${{ secrets.JELLY_KEYSTORE_PASSWORD }}

      # Only an APK signed with the release key (this certificate) may reach the phones.
      - name: Check the signing certificate
        id: certificate
        run: |
          set -euo pipefail
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          digest="$("$tools/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1)"
          echo "certificate SHA-256: $digest"
          if [ "$digest" = "08b15fad25691fef1f7c36f409d92e919813acf1b1417248f7880fcdee3539a2" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Not signed with the release key; the APK is built and tested but not published."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/JellyCalendar-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: JellyCalendar-apk
          path: jelly-calendar/dist/*.apk
          if-no-files-found: error

  # The shared calendar ("공유 젤리"): security rules and a two-phone run through the web app,
  # both against the Firebase emulators.
  shared:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: jelly-calendar/share
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: jelly-calendar/share/package-lock.json

      - name: Install tools
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: The bundled Firebase SDK matches the lockfile
        run: |
          npm run bundle
          git diff --exit-code -- ../../docs/share/vendor/firebase.js

      - name: Security rules
        run: npm run test:rules

      - name: Two phones on one shared calendar
        run: npm run test:e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-screenshots
          path: jelly-calendar/share/test-results/
          if-no-files-found: ignore

  # Opens the new APK on an Android emulator: fails when the app crashes, and puts screenshots
  # and the log on the "jelly-calendar-smoke" pre-release so they can be seen without signing in.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: JellyCalendar-apk
          path: dist

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash jelly-calendar/ci/smoke-test.sh "$(ls dist/*.apk | head -n 1)" smoke

      - name: Publish screenshots and log
        if: always() && (github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || startsWith(github.ref_name, 'claude/'))
        run: |
          set -uo pipefail
          files=$(ls smoke/*.png smoke/logcat.txt 2>/dev/null || true)
          if [ -z "$files" ]; then echo "nothing to publish"; exit 0; fi
          tag=jelly-calendar-smoke
          gh release delete "$tag" --yes --cleanup-tag || true
          gh api -X DELETE "repos/${GH_REPO}/git/refs/tags/${tag}" >/dev/null 2>&1 || true
          sleep 3
          gh release create "$tag" $files \
            --target "$GITHUB_SHA" \
            --prerelease --latest=false \
            --title "에뮬레이터 실행 확인 (${GITHUB_SHA::7})" \
            --notes "새 APK를 안드로이드 에뮬레이터에서 실행해 찍은 화면과 로그입니다. 설치용 파일은 jelly-calendar-latest 릴리스에 있습니다."

  # Replaces one rolling release so that the phone can always download the newest APK
  # from the same link, without signing in:
  # https://github.com/<owner>/<repo>/releases/download/jelly-calendar-latest/JellyCalendar.apk
  release:
    needs: build
    if: needs.build.outputs.signed == 'true' && (github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || startsWith(github.ref_name, 'claude/'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: jelly-calendar-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: jelly-calendar-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: JellyCalendar-apk
          path: dist

      - name: Publish the rolling release
        run: |
          set -euo pipefail
          apk="$(ls dist/*.apk | head -n 1)"
          cp "$apk" dist/JellyCalendar.apk
          short="${GITHUB_SHA::7}"
          cat > notes.md <<EOF
          푸시할 때마다 자동으로 다시 만들어지는 최신 빌드입니다 (커밋 ${short}).

          - 설치: 휴대폰에서 아래 **JellyCalendar.apk**를 눌러 내려받은 뒤 실행합니다. “출처를 알 수 없는 앱 설치”를 허용해야 합니다.
          - 업데이트: 새 APK를 그대로 덮어 설치하면 데이터가 유지됩니다.
          EOF
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh api -X DELETE "repos/${GH_REPO}/git/refs/tags/${TAG}" >/dev/null 2>&1 || true
          sleep 3
          gh release create "$TAG" dist/JellyCalendar.apk \
            --target "$GITHUB_SHA" \
            --title "젤리 캘린더 최신 버전 (${short})" \
            --notes-file notes.md \
            --latest
