name: Jelly Calendar APK

on:
  push:
    paths:
      - "jelly-calendar/**"
      - ".github/workflows/jelly-calendar-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: jelly-calendar
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (scheduling rules)
        run: ./gradlew --no-daemon :core:test

      - name: Build APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/JellyCalendar-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: JellyCalendar-apk
          path: jelly-calendar/dist/*.apk
          if-no-files-found: error
